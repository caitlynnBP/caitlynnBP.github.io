<script>
    const message = "meche + cs @ columbia · building cool things · class of 2028";
    const target = document.getElementById("typing");
    let i = 0;
    function typeNext() {
      if (i < message.length) {
        target.textContent += message[i];
        i++;
        setTimeout(typeNext, 55);
        }
    }
    typeNext();
